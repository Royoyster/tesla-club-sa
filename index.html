<!DOCTYPE html>
<html lang="en-ZA">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0B0E12" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Tesla Club SA" />
  <meta name="description" content="A community-run club for Tesla owners and fans in Cape Town. Independent. Not affiliated with Tesla, Inc." />
  <title>Tesla Club SA</title>
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
:root {
  --bg: #07090c;
  --card: #12161c;
  --line: #232a34;
  --text: #eef1f5;
  --muted: #9aa4b2;
  --teal: #e31937;
  --teal-ink: #fff7f7;
  --pink: #ff3fa4;
  --amber: #ffb02e;
  --danger: #ff6b7a;
  --shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
  font-synthesis: none;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); }
body {
  font-family: Inter, ui-sans-serif, system-ui, sans-serif;
  font-size: 16px;
  line-height: 1.5;
  min-height: 100dvh;
}
body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  background:
    radial-gradient(ellipse 60% 46% at 108% -8%, rgba(227, 25, 55, 0.22), transparent 60%),
    radial-gradient(ellipse 52% 40% at -12% -6%, rgba(227, 25, 55, 0.16), transparent 58%),
    radial-gradient(ellipse 70% 40% at 50% 120%, rgba(227, 25, 55, 0.06), transparent 50%),
    var(--bg);
  z-index: 0;
}
body::after {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  opacity: 0.7;
  background-image:
    radial-gradient(1px 1px at 12% 18%, rgba(255,255,255,.7) 50%, transparent 52%),
    radial-gradient(1px 1px at 28% 62%, rgba(255,255,255,.4) 50%, transparent 52%),
    radial-gradient(1.2px 1.2px at 46% 28%, rgba(255,255,255,.45) 50%, transparent 52%),
    radial-gradient(1px 1px at 68% 14%, rgba(255,255,255,.55) 50%, transparent 52%),
    radial-gradient(1px 1px at 82% 48%, rgba(255,255,255,.35) 50%, transparent 52%),
    radial-gradient(1.4px 1.4px at 90% 76%, rgba(255,255,255,.4) 50%, transparent 52%),
    radial-gradient(1px 1px at 8% 84%, rgba(255,255,255,.3) 50%, transparent 52%),
    radial-gradient(1px 1px at 54% 78%, rgba(255,255,255,.28) 50%, transparent 52%),
    radial-gradient(1px 1px at 36% 42%, rgba(255,255,255,.25) 50%, transparent 52%);
  background-size: 280px 360px;
}
a { color: var(--teal); text-decoration: none; }
button, input, select, textarea { font: inherit; color: inherit; }
img { max-width: 100%; }
.shell {
  width: min(450px, 100%);
  margin: 0 auto;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  position: relative;
  z-index: 1;
}
.header {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
  background: rgba(7, 9, 12, 0.86);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid rgba(35, 42, 52, 0.8);
}
.brand { display: flex; align-items: center; gap: 8px; color: var(--text); margin-right: auto; }
.brand svg, .logo { width: 40px; height: 40px; display: block; flex: none; }
.hero-banner {
  margin: -22px -16px 18px;
  border-radius: 0 0 18px 18px;
  overflow: hidden;
  position: relative;
  box-shadow: 0 12px 40px rgba(0,0,0,.45);
}
.hero-banner img {
  display: block;
  width: 100%;
  height: auto;
  object-fit: cover;
  max-height: 220px;
}
.hero-banner::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(to bottom, transparent 40%, rgba(7,9,12,.55));
  pointer-events: none;
}
.hero-mark .logo { width: 72px; height: 72px; filter: drop-shadow(0 0 16px rgba(227, 25, 55, 0.35)); }
.nav { display: flex; align-items: center; gap: 8px; }
.nav a {
  color: var(--text);
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  padding: 8px 10px;
  border-radius: 999px;
}
.nav a.ghost {
  border: 1px solid var(--line);
  background: #0d1116;
}
main { flex: 1; padding: 22px 16px 28px; }
h1, h2, h3 {
  font-family: Archivo, Inter, sans-serif;
  font-weight: 900;
  text-transform: uppercase;
  letter-spacing: 0.03em;
  line-height: 0.95;
  margin: 0 0 12px;
}
h1 { font-size: 42px; }
h2 { font-size: 26px; }
h3 { font-size: 16px; letter-spacing: 0.05em; }
.glow { color: var(--teal); text-shadow: 0 0 18px rgba(227, 25, 55, 0.75); }
.eyebrow {
  color: var(--muted);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  margin: 0 0 10px;
}
.lede { color: var(--text); font-size: 17px; margin: 0 0 18px; }
.muted { color: var(--muted); }
.fine { color: var(--muted); font-size: 13px; margin: 10px 0 0; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  border-radius: 999px;
  padding: 13px 18px;
  border: 1px solid transparent;
  font-weight: 800;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  font-size: 13px;
  cursor: pointer;
  text-align: center;
  width: 100%;
}
.btn-primary {
  background: var(--teal);
  color: var(--teal-ink);
  box-shadow: 0 0 22px rgba(227, 25, 55, 0.42);
}
.btn-secondary { background: #0d1116; color: var(--text); border-color: var(--line); }
.btn-wa { background: #1faa59; color: #04210f; box-shadow: 0 0 18px rgba(31, 170, 89, 0.28); }
.btn-danger { background: transparent; color: var(--danger); border-color: rgba(255, 107, 122, 0.45); }
.btn[disabled] { opacity: 0.55; cursor: not-allowed; }
.btn.on { outline: 2px solid var(--teal); }
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 16px;
  box-shadow: var(--shadow);
}
.cards { display: flex; flex-direction: column; gap: 12px; }
.card p:last-child { margin-bottom: 0; }
.card p { margin: 0; color: var(--muted); }
.card h3 { margin-bottom: 8px; }
label { display: block; font-size: 13px; font-weight: 650; margin: 12px 0 6px; }
input, select, textarea {
  width: 100%;
  background: #0c1015;
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 12px 12px;
  outline: none;
}
textarea { min-height: 88px; resize: vertical; }
input:focus, select:focus, textarea:focus { border-color: var(--teal); box-shadow: 0 0 0 3px rgba(227, 25, 55, 0.15); }
.hint { color: var(--muted); font-size: 12px; margin-top: 6px; }
.error { color: #ffb4bc; font-size: 14px; margin: 8px 0 0; }
.check { display: flex; gap: 10px; align-items: flex-start; margin: 10px 0; font-size: 14px; }
.check input { width: 18px; height: 18px; margin-top: 2px; accent-color: var(--teal); }
.progress { height: 6px; background: #1b212a; border-radius: 99px; overflow: hidden; margin: 8px 0 16px; }
.progress span { display: block; height: 100%; background: var(--teal); box-shadow: 0 0 12px rgba(227, 25, 55, 0.6); }
.date-tile {
  width: 64px;
  height: 64px;
  flex: none;
  border: 1.5px solid var(--teal);
  box-shadow: 0 0 16px rgba(227, 25, 55, 0.4), inset 0 0 10px rgba(227, 25, 55, 0.08);
  background: #07090c;
  border-radius: 8px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  line-height: 1;
}
.date-tile b { font-family: Archivo, sans-serif; font-size: 18px; letter-spacing: 0.02em; }
.date-tile i { font-style: normal; color: var(--teal); font-size: 11px; margin: 1px 0; opacity: 0.9; font-weight: 800; }
.date-tile span { font-size: 11px; letter-spacing: 0.14em; color: var(--teal); font-weight: 800; }
.event-row, .member-card-row { display: flex; gap: 12px; align-items: flex-start; }
.badge {
  display: inline-block;
  background: var(--amber);
  color: #2a1a00;
  font-weight: 800;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  font-size: 11px;
  padding: 5px 8px;
  border-radius: 999px;
  margin-bottom: 8px;
}
.amber {
  background: rgba(255, 176, 46, 0.1);
  border: 1px solid rgba(255, 176, 46, 0.5);
  color: #ffe1a8;
  border-radius: 14px;
  padding: 14px;
  margin: 14px 0;
}
.amber h3 { color: var(--amber); }
.draft {
  background: #3a2a08;
  color: #ffd98a;
  border: 1px solid var(--amber);
  border-radius: 12px;
  padding: 10px 12px;
  font-weight: 800;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  font-size: 12px;
  margin-bottom: 14px;
}
.member-card {
  background:
    radial-gradient(ellipse 80% 60% at 100% 0%, rgba(227, 25, 55, 0.16), transparent 55%),
    linear-gradient(180deg, #161c24, #10141a);
  border: 1px solid rgba(227, 25, 55, 0.35);
  box-shadow: 0 0 28px rgba(227, 25, 55, 0.12);
  border-radius: 20px;
  padding: 16px;
}
.member-card .kicker { letter-spacing: 0.16em; font-size: 11px; color: var(--teal); font-weight: 800; }
.member-card .no { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); font-size: 13px; }
.member-card .who { font-family: Archivo, sans-serif; font-weight: 900; font-size: 26px; text-transform: uppercase; margin: 8px 0 4px; }
.install {
  border: 1px dashed var(--line);
  border-radius: 16px;
  padding: 12px;
  background: rgba(18, 22, 28, 0.7);
}
.footer {
  padding: 8px 16px calc(22px + env(safe-area-inset-bottom));
  color: var(--muted);
  font-size: 13px;
}
.socials, .footer-links { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 10px; }
.socials a, .footer-links a { color: var(--muted); font-weight: 650; }
.disclaimer { margin: 0 0 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  border: 1px solid var(--line);
  background: #0c1015;
  border-radius: 999px;
  padding: 8px 12px;
  font-size: 13px;
  cursor: pointer;
}
.chip.on { border-color: var(--teal); color: var(--teal); box-shadow: 0 0 12px rgba(227, 25, 55, 0.2); }
hr.fade { border: 0; border-top: 1px solid var(--line); margin: 18px 0; }
.ok { color: #b6ffe8; }
.how li { margin: 0 0 8px; color: var(--muted); }
.how li:last-child { margin-bottom: 0; }
.member-card .lockup { display: flex; align-items: center; gap: 12px; }
.rules { margin: 0; padding-left: 18px; }
@media (min-width: 480px) {
  .btn.fit { width: auto; }
}

  </style>
</head>
<body>
  <div class="shell">
    <header class="header">
      <a class="brand" href="#/" aria-label="Tesla Club SA home" id="brand"></a>
      <nav class="nav">
        <a href="#/events">Events</a>
        <a class="ghost" href="#/signin" id="account-link">Sign in</a>
      </nav>
    </header>
    <main id="app"></main>
    <footer class="footer">
      <div class="socials">
        <a href="https://www.instagram.com/teslaclubzar" target="_blank" rel="noopener">Instagram</a>
        <a href="https://www.threads.com/@teslaclubzar" target="_blank" rel="noopener">Threads</a>

        <a href="https://www.facebook.com/share/18h9qo3HQd/?mibextid=wwXIfr" target="_blank" rel="noopener">Facebook</a>
        <a href="https://x.com/teslazar" target="_blank" rel="noopener">X</a>
        <a href="https://x.com/i/communities/1847461342971908211" target="_blank" rel="noopener">X Community</a>
        <a href="https://chat.whatsapp.com/Hwl2LEwkZxD0NHjTeHtF09?mode=gi_t" target="_blank" rel="noopener">WhatsApp</a>
      </div>
      <p class="disclaimer">Independent owners' and fans' club. Not affiliated with or endorsed by Tesla, Inc.</p>
      <div class="footer-links">
        <a href="#/privacy">Privacy (POPIA)</a>

        <a href="#/admin">Admin</a>
      </div>
    </footer>
  </div>
  <script>
"use strict";

const NOTICE_VERSION = "2026-10-draft-1";
const SESSION_MS = 90 * 24 * 60 * 60 * 1000;
const REGIONS = ["City Bowl", "Atlantic Seaboard", "Southern Suburbs", "Northern Suburbs", "Helderberg", "Winelands", "West Coast", "Other Western Cape", "Gauteng", "KZN", "Other"];
const STATUSES = ["I own one", "On order", "Fan (not yet!)"];
const MODELS = ["Model 3", "Model Y", "Model S", "Model X", "Cybertruck", "Other", "None yet"];
const INTERESTS = ["Meetups", "Light shows", "Road trips", "Charity drives", "Launch watch parties"];
const HEARD = ["Instagram", "Facebook", "X (Twitter)", "TikTok", "WhatsApp", "A friend or member", "Saw us at a meetup", "Google / web search", "Other"];

function seedEvents() {
  return [
    {
      id: "evt-coffee-example",
      title: "Monthly coffee meetup",
      start: "2026-11-07T08:30:00+02:00",
      end: "2026-11-07T10:30:00+02:00",
      place: "Example venue – to be confirmed",
      area: "Southern Suburbs (example)",
      summary: "EXAMPLE – not a real event. This shows what a monthly meetup listing will look like: coffee, walk-arounds and a short club welcome. Owners and fans welcome.",
      bring: "Your car if you have one (fans very welcome without), a jacket for the Cape wind, and questions for the new-owner corner.",
      safety: "Marshals will help with parking; please follow their lead. Keep it relaxed and neighbourly.",
      example: true,
      published: true,
    },
    {
      id: "evt-lightshow-example",
      title: "Light show evening (we're planning)",
      start: "2026-11-28T19:30:00+02:00",
      end: null,
      place: "Example venue – to be confirmed",
      area: "Cape Town (example)",
      summary: "EXAMPLE – not a real event. We're planning a light show using the Light Show feature built into the cars. It's run by the club, not Tesla. Members are welcome to join in. If the wind or rain is bad, or the venue asks us to, we'll move or cancel it and post an update.",
      bring: "A charged car if you're taking part, a warm layer, and patience while we park everyone.",
      safety: "We'll plan the venue and timing properly, keep the volume respectful, and post an update if weather or access changes.",
      example: true,
      published: true,
    },
  ];
}

function loadDb() {
  try {
    const parsed = JSON.parse(localStorage.getItem("tcsa-db") || "");
    if (!parsed || !Array.isArray(parsed.events)) throw new Error("empty");
    return parsed;
  } catch {
    return { members: [], sessions: [], events: seedEvents(), rsvps: [], nextMember: 1, adminPassword: "" };
  }
}
function saveDb(db) {
  localStorage.setItem("tcsa-db", JSON.stringify(db));
}
function memberNo(n) {
  return "TCSA-" + String(n).padStart(4, "0");
}
function firstName(name) {
  return String(name || "").trim().split(/\s+/)[0] || "there";
}
function publicMember(m) {
  return {
    id: m.id,
    memberNo: memberNo(m.number),
    name: m.name,
    email: m.email,
    mobile: m.mobile || "",
    region: m.region,
    teslaStatus: m.teslaStatus,
    model: m.model,
    interests: m.interests || [],
    heardFrom: m.heardFrom || "",
    whatsappOptIn: !!m.whatsappOptIn,
    newsOptIn: !!m.newsOptIn,
    consentAt: m.consentAt,
    consentVersion: m.consentVersion,
    joinedAt: m.joinedAt,
    firstName: firstName(m.name),
    lastSignInAt: m.lastSignInAt || null,
  };
}
function sessionMember(db) {
  const token = localStorage.getItem("tcsa-session");
  const session = (db.sessions || []).find((s) => s.token === token && s.expiresAt > Date.now());
  if (!session) return null;
  return db.members.find((m) => m.id === session.memberId) || null;
}
function eventPublic(db, event, member) {
  const rsvps = db.rsvps.filter((r) => r.eventId === event.id);
  const mine = member ? rsvps.find((r) => r.memberId === member.id) : null;
  return {
    id: event.id,
    title: event.title,
    start: event.start,
    end: event.end || null,
    place: event.place,
    area: event.area,
    summary: event.summary,
    bring: event.bring,
    safety: event.safety,
    example: !!event.example,
    published: !!event.published,
    counts: {
      going: rsvps.filter((r) => r.status === "going").length,
      maybe: rsvps.filter((r) => r.status === "maybe").length,
      cant: rsvps.filter((r) => r.status === "cant").length,
    },
    rsvp: mine ? mine.status : null,
  };
}
function normaliseMobile(input) {
  if (input == null || String(input).trim() === "") return "";
  let raw = String(input).replace(/[\s()-]/g, "");
  if (raw.startsWith("+")) raw = raw.slice(1);
  if (raw.startsWith("27") && raw.length === 11) return "+" + raw;
  if (raw.startsWith("0") && raw.length === 10) return "+27" + raw.slice(1);
  return null;
}
function validEmail(email) {
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
}
function csvCell(value) {
  let s = value == null ? "" : String(value);
  if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;
  if (/[",\n\r]/.test(s)) s = `"${s.replace(/"/g, '""')}"`;
  return s;
}

function handle(path, method, body) {
  const db = loadDb();
  const member = sessionMember(db);
  const admin = localStorage.getItem("tcsa-admin") === "1";

  if (path === "/api/meta") {
    return { status: 200, body: { regions: REGIONS, statuses: STATUSES, models: MODELS, interests: INTERESTS, heard: HEARD, noticeVersion: NOTICE_VERSION } };
  }
  if (path === "/api/me" && method === "GET") {
    return { status: 200, body: { member: member ? publicMember(member) : null } };
  }
  if (path === "/api/join" && method === "POST") {
    if (body.ageConfirmed !== true) return { status: 400, body: { error: "You need to confirm you are 18 or older." } };
    if (body.consent !== true) return { status: 400, body: { error: "Please agree to the club using your details to run the club." } };
    const name = String(body.name || "").trim().replace(/\s+/g, " ");
    const email = String(body.email || "").trim().toLowerCase();
    const mobile = normaliseMobile(body.mobile);
    if (name.length < 2) return { status: 400, body: { error: "Please add your name." } };
    if (!validEmail(email)) return { status: 400, body: { error: "That email doesn't look right." } };
    if (mobile === null) return { status: 400, body: { error: "Use a South African mobile, or leave it blank." } };
    if (!REGIONS.includes(body.region)) return { status: 400, body: { error: "Choose a region." } };
    if (!STATUSES.includes(body.teslaStatus)) return { status: 400, body: { error: "Choose your Tesla status." } };
    if (!MODELS.includes(body.model)) return { status: 400, body: { error: "Choose a model." } };
    if (body.heardFrom && !HEARD.includes(body.heardFrom)) return { status: 400, body: { error: "Choose how you heard about us, or leave it blank." } };
    if (db.members.some((m) => m.email === email)) return { status: 409, body: { error: "That email is already a member. Sign in instead." } };
    const created = {
      id: crypto.randomUUID(),
      number: db.nextMember++,
      name,
      email,
      mobile,
      region: body.region,
      teslaStatus: body.teslaStatus,
      model: body.model,
      interests: Array.isArray(body.interests) ? body.interests.filter((i) => INTERESTS.includes(i)) : [],
      heardFrom: body.heardFrom || "",
      whatsappOptIn: body.whatsappOptIn === true,
      newsOptIn: body.newsOptIn === true,
      consentAt: new Date().toISOString(),
      consentVersion: NOTICE_VERSION,
      joinedAt: new Date().toISOString(),
      lastSignInAt: new Date().toISOString(),
    };
    db.members.push(created);
    const token = crypto.randomUUID();
    db.sessions.push({ token, memberId: created.id, expiresAt: Date.now() + SESSION_MS });
    saveDb(db);
    localStorage.setItem("tcsa-session", token);
    return { status: 200, body: { member: publicMember(created) } };
  }
  if (path === "/api/me" && method === "PATCH") {
    if (!member) return { status: 401, body: { error: "Sign in first." } };
    const name = String(body.name || "").trim().replace(/\s+/g, " ");
    const email = String(body.email || "").trim().toLowerCase();
    const mobile = normaliseMobile(body.mobile);
    if (name.length < 2) return { status: 400, body: { error: "Please add your name." } };
    if (!validEmail(email)) return { status: 400, body: { error: "That email doesn't look right." } };
    if (mobile === null) return { status: 400, body: { error: "Use a South African mobile, or leave it blank." } };
    if (!REGIONS.includes(body.region) || !STATUSES.includes(body.teslaStatus) || !MODELS.includes(body.model)) {
      return { status: 400, body: { error: "Choose a region, status and model." } };
    }
    if (db.members.some((m) => m.email === email && m.id !== member.id)) return { status: 409, body: { error: "That email is already a member." } };
    Object.assign(member, {
      name,
      email,
      mobile,
      region: body.region,
      teslaStatus: body.teslaStatus,
      model: body.model,

        if (!draft.region || !draft.teslaStatus || !draft.model) return fail("Choose a region, status and model.");
        draft.error = "";
        draft.step = 4;
        paint();
      };
    }
    if (draft.step === 4) {
      step.innerHTML = `<h1>What are you keen on?</h1>
        <div class="chips" id="interests">${meta.interests.map((i) => `<button type="button" class="chip ${draft.interests.includes(i) ? "on" : ""}" data-i="${esc(i)}">${esc(i)}</button>`).join("")}</div>
        <label for="heard">How did you hear about us?</label>
        <select id="heard"><option value="">Optional</option>${meta.heard.map((h) => `<option ${draft.heardFrom === h ? "selected" : ""}>${esc(h)}</option>`).join("")}</select>
        <div class="stack" style="margin-top:16px"><button class="btn btn-primary" id="next" type="button">Next</button><button class="btn btn-secondary" id="back" type="button">Back</button></div>`;
      step.querySelectorAll(".chip").forEach((chip) => chip.onclick = () => {
        const name = chip.dataset.i;
        draft.interests = draft.interests.includes(name) ? draft.interests.filter((i) => i !== name) : draft.interests.concat(name);
        chip.classList.toggle("on");
      });
      step.querySelector("#back").onclick = () => { draft.step = 3; paint(); };
      step.querySelector("#next").onclick = () => { draft.heardFrom = step.querySelector("#heard").value; draft.step = 5; paint(); };
    }
    if (draft.step === 5) {
      step.innerHTML = `<h1>Last bit: your privacy</h1>
        <div class="card"><p>We use your details only to run the club: event invites and club updates. We don't sell or share your data. Ask us to update or delete your info anytime: teslaclubzar@gmail.com. <a href="/privacy" target="_blank" rel="noopener">Full notice</a>.</p></div>
        <label class="check"><input type="checkbox" id="consent" ${draft.consent ? "checked" : ""}/> <span>I agree that Tesla Club SA may use my details to run the club, as described above.</span></label>
        <label class="check"><input type="checkbox" id="wa" ${draft.whatsappOptIn ? "checked" : ""}/> <span>Yes, I'd like to be in the club WhatsApp group.</span></label>
        <label class="check"><input type="checkbox" id="news" ${draft.newsOptIn ? "checked" : ""}/> <span>Send me club news by email (event announcements, a few times a month at most).</span></label>
        ${err(draft.error)}
        <div class="stack" style="margin-top:16px"><button class="btn btn-primary" id="next" type="button">Join the club</button><button class="btn btn-secondary" id="back" type="button">Back</button></div>`;
      step.querySelector("#back").onclick = () => { draft.step = 4; paint(); };
      step.querySelector("#next").onclick = async () => {
        draft.consent = step.querySelector("#consent").checked;
        draft.whatsappOptIn = step.querySelector("#wa").checked;
        draft.newsOptIn = step.querySelector("#news").checked;
        if (!draft.consent) return fail("Please tick the agreement to join.");
        try {
          const data = await api("/api/join", { method: "POST", body: { ...draft, ageConfirmed: true } });
          me = data.member;
          sessionStorage.setItem("tcsa-welcome", "1");
          setAccount();
          go("/home");
        } catch (e) { fail(e.message); }
      };
    }
    function fail(message) { draft.error = message; paint(); }
  };
  paint();
}

function toLocal(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  const pad = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function fromLocal(value) {
  if (!value) return null;
  const d = new Date(value);
  const pad = (n) => String(n).padStart(2, "0");
  const off = -d.getTimezoneOffset();
  const sign = off >= 0 ? "+" : "-";
  const hh = pad(Math.floor(Math.abs(off) / 60));
  const mm = pad(Math.abs(off) % 60);
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}:00${sign}${hh}:${mm}`;
}
